<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calculator App</title>
    
    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css">
 
  </head>  
  <body>
    <div class="wrapper">
        <section class="calculator-screen">
          <div id="display">0</div>
        </section>
    
        <section class="calculator-buttons">
          <button class="clear" data-action="clear">C</button>
          <button data-action="backspace">←</button>
          <button class="operator" data-action="operator" data-value="÷">÷</button>

          <button data-value="7">7</button>
          <button data-value="8">8</button>
          <button data-value="9">9</button>
          <button class="operator" data-action="operator" data-value="×">×</button>

          <button data-value="4">4</button>
          <button data-value="5">5</button>
          <button data-value="6">6</button>
          <button class="operator" data-action="operator" data-value="−">−</button>

          <button data-value="1">1</button>
          <button data-value="2">2</button>
          <button data-value="3">3</button>
          <button class="operator" data-action="operator" data-value="+">+</button>

          <button class="zero" data-value="0">0</button>
          <button data-action="decimal">.</button>
          <button class="operator" data-action="equals">=</button>
        </section>
    </div>
    
    <script src="script.js"></script>

  </body>
</html>
